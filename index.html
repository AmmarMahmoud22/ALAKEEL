<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأكيلة | المنيو</title>
<meta name="theme-color" content="#e11d2e">
<link rel="preload" as="image" href="img/logo.webp" type="image/webp"><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <span class="blob b1"></span><span class="blob b2"></span>
  <div class="floaties"><i>🍔</i><i>🍟</i><i>🌮</i><i>🍝</i><i>🥤</i><i>🧀</i></div>
  <p class="kicker">أكل شهي .. بمذاق <b>مميز</b></p>
  <img class="logo" src="img/logo.webp" alt="الأكيلة" width="520" height="250" fetchpriority="high" decoding="async">
  <p class="tag">♥ الطعم اللي يخليك ترجع تاني</p>
  <a class="cta" href="#sand">🔥 اطلب دلوقتي</a>
</header>
<nav id="tabs" class="tabs"></nav>
<main id="menu"></main>
<footer class="foot">الأكيلة .. دايماً اختيارك الأفضل ♥</footer>

<div id="bar" class="bar hidden"><button id="open">🛒 <span id="count">0</span> صنف · عرض الطلب<span id="sum"></span></button></div>

<div id="sheet" class="sheet hidden">
  <div class="panel">
    <div class="ph"><h2>🧾 طلبك</h2><button id="close" aria-label="إغلاق">✕</button></div>
    <div id="lines"></div>
    <div id="total" class="total"></div>
    <input id="name" placeholder="الاسم (اختياري)">
    <input id="addr" placeholder="العنوان / رقم الطاولة (اختياري)">
    <textarea id="note" rows="2" placeholder="ملاحظات على الطلب (اختياري)"></textarea>
    <button id="send" class="send">إرسال الطلب على واتساب 💬</button>
    <button id="clear" class="ghost">مسح الطلب</button>
  </div>
</div>
<canvas id="fx"></canvas>
<script defer src="config.js"></script>
<script defer src="menu.js"></script>
<script defer src="app.js"></script>
</body>
</html>
